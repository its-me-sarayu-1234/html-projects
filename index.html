<h1>Doctor Appointment 📅</h1>
<p>Please fill out the form below to schedule your appointment.</p>
<hr>

<form>
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required>
  <br><br>
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required>
  <br><br>
  <label for="date">Date:</label>
  <input type="date" id="date" name="date" required>
  <br><br>
  <label for="time">Time:</label>
  <input type="time" id="time" name="time" required>
  <br><br>
  <label for="doctor">Select Doctor:</label>
  <select id="doctor" name="doctor" required>
    <option value="">--Please choose an option--</option>
    <option value="dr_smith">Dr. Smith</option>
    <option value="dr_jones">Dr. Jones</option>
    <option value="dr_brown">Dr. Brown</option>
  </select>
  <br><br>
  <label for="reason">Reason for Appointment:</label>
  <textarea id="reason" name="reason" rows="4" cols="50" required></textarea>
  <br><br>
  <label for="insurance">Insurance Provider:</label>
  <input type="text" id="insurance" name="insurance" required>
  <br><br>
  <label for="phone">Phone Number:</label>
  <input type="tel" id="phone" name="phone" required>
  <br><br>
  <label for="notes">Additional Notes:</label>
  <textarea id="notes" name="notes" rows="4" cols="50"></textarea>
  <br><br>
  <label for="reminder">Would you like to receive a reminder?</label>
  <input type="checkbox" id="reminder" name="reminder">
  <br><br>
  <input type="submit" value="Schedule Appointment">
</form>

<label for="language">Preferred Language:</label>
<select id="language" name="language" required>
  <option value="">--Please choose an option--</option>
